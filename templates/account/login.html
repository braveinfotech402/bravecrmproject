<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #b2dded, #f1f4f5);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 500;
      color: #555;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4facfe;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      margin-top: 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .remember-me {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }

    .signup-box {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }

    .signup-box a {
      color: #007BFF;
      text-decoration: none;
    }

    .signup-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
 
  <form method="post">
    {% csrf_token %}
    <div class="login-box">
      <h2>Login</h2>

      <label for="email">Email Address:</label>
      <input type="text" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <div class="remember-me">
        <input type="checkbox" id="remember" name="remember" checked>
        <label for="remember">Remember me</label>
      </div>

      <button type="submit">Login</button>

      <div class="signup-box">
        New user? <a href="{% url 'register' %}">Sign Up</a>
      </div>
    </div>
  </form>
 
</body>
</html>
