{% extends "base.html" %}
{% block content %}
<form class="example" action="{% url 'search' %}" method="GET">
  <!-- Search Input -->
  <input type="text" placeholder="Search by name or email..." name="search" value="{{ query }}">
  
  <!-- Status Dropdown -->
  <select name="status" onchange="this.form.submit()">
      <option value="">🔍 Filter by</option>
      <option value="new" {% if selected_status == "new" %}selected{% endif %}>🟢 New</option>
      <option value="follow up" {% if selected_status == "follow up" %}selected{% endif %}>🟡 Follow Up</option>
      <option value="won" {% if selected_status == "won" %}selected{% endif %}>✅ Won</option>
      <option value="lost" {% if selected_status == "lost" %}selected{% endif %}>❌ Lost</option>
      <option value="later" {% if selected_status == "later" %}selected{% endif %}>🕒 Later</option>
  </select>

  <!-- Search Button -->
  <button type="submit"><i class="fa fa-search"></i></button>
</form>


<div style="display: flex; justify-content: flex-end; align-items: center; position: absolute; top: 90px; right: 20px;gap: 10px;">


<a href="{% url 'kanban_view' %}" class="btn-custom"  style="margin: 0;">Kanban view</a>
<a href="{% url 'createlead' %}" class="btn-custom"  style="margin: 0;">+ Add Leads</a>
</div><br>

<div class="form-container">
<table class="table table-striped">
<thead>
  <tr>
      <th style="text-align:center;">Name</th>
      <th style="text-align:center;">Email</th>
      <th style="text-align:center;">Status</th>
      <th style="text-align:center;">Actions</th>
  </tr>
</thead>
<tbody>
  {% for lead in leads %}
      <tr>
          <td>{{ lead.firstname }}</td>
          <td><a href="{% url 'lead_update' lead.id %}">{{ lead.email }}</a></td>
          <td>{{ lead.status }}</td>
          <td>
              <a href="{% url 'lead_detail' lead.id %}" class="btn btn-info btn-sm">View</a>
              <a href="{% url 'lead_update' lead.id %}" class="btn btn-warning btn-sm">Edit</a>
              <form action="{% url 'lead_delete' lead.id %}" method="post" style="display:inline;">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger btn-sm">Delete</button>
              </form>
          </td>
      </tr>
  {% empty %}
      <tr>
          <td colspan="4" class="text-center">No leads found.</td>
      </tr>
  {% endfor %}
</tbody>
</table>
</div>


<script>
document.getElementById("avatar").addEventListener("click", function (event) {
event.stopPropagation(); // Prevents click from propagating to document
let dropdown = document.getElementById("dropdownMenu");
dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
});

// Hide dropdown when clicking outside
document.addEventListener("click", function () {
document.getElementById("dropdownMenu").style.display = "none";
});
</script>

{% endblock %}
