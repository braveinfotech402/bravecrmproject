{% extends "base.html" %}
{% load static %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<input type="hidden" id="csrfToken" value="{{ csrf_token }}">

<div class="container mt-5">
  <!-- Board & Back Buttons -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="btn-group">
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createBoardModal">
        <i class="bi bi-board"></i> Boards
      </button>
    </div>
    
    <a href="{% url 'client_dashboard' %}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left-circle"></i> Back to Leads
    </a>
  </div>
  

  </div>

  <!-- Board List Container -->
  <div id="board-list-container" class="mt-4">
    <h4>Your Boards</h4>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <!-- You can load boards using Django here -->
      {% for board in boards %}
      <div class="col">
        <div class="card shadow-sm border-light rounded">
          <div class="card-body d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">{{ board.name }}</h5>
            <a href="{% url 'board_details' board.id %}" class="btn btn-sm btn-primary">
              <i class="bi bi-eye"></i> Open
            </a>
          </div>
        </div>
      </div>
      {% empty %}
      <div class="col-12">
        <div class="alert alert-info text-center" role="alert">
          No boards yet. Start by creating one!
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<!-- Create New Board Modal -->
<div class="modal fade" id="createBoardModal" tabindex="-1" aria-labelledby="createBoardModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form method="POST" action="{% url 'create_board' %}">
          {% csrf_token %}
          <div class="modal-header">
            <h5 class="modal-title" id="createBoardModalLabel">Create New Board</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- Board Name -->
            <div class="mb-3">
              <label for="board-name" class="form-label">Board Name</label>
              <input type="text" class="form-control w-100" id="board-name" name="board_name" required placeholder="Enter board name...">

            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              <i class="bi bi-x-circle"></i> Close
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Create
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

<script src="{% static 'js/createNewBoard.js' %}"></script>
<script src="{% static 'js/createNewColumn.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
