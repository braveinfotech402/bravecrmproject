{% extends "base.html" %}
{% block content %}
<!-- Tagify CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css">

<!-- Tagify JS -->
<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>

<style>
   /* Ensure Tagify input spans full width */
  .tagify-style {
    width: 100% !important;
  }

  .tagify {
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 0.375rem 0.75rem;
    width: 100%;
  }

  .tagify__input {
    min-height: 38px;
  }
</style>
<div class="container">
  <h3>{% if lead %}Update Lead{% else %}Create New Lead{% endif %}</h3>
  <form class="form-container" method="post" enctype="multipart/form-data">


    {% csrf_token %}
        <input type="hidden" name="board_id" value="{{ board_id }}">
<input type="hidden" name="column_id" value="{{ column_id }}">
    <div class="row">
      <div class="col-md-6">
          <label style="font-weight:lighter;">First Name</label>
          <input type="text" name="firstname" placeholder="Enter first name">
      </div>
      <div class="col-md-6">
          <label style="font-weight:lighter;">Last Name</label>
          <input type="text" name="lastname" placeholder="Enter last name">
      </div>
  </div>
    <div class="row">
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Street Name:</label>
        <input type="text" name="streetaddress" placeholder="Enter street address">
      </div>
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Street Number:</label>
        <input type="text" name="streetnumber" placeholder="Enter street number">
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Postal Code:</label>
        <input type="text" name="postalcode" placeholder="Enter Postal code">
      </div>
      <div class="col-sm-6">
        <label style="font-weight:lighter;">City:</label>
        <input type="text" name="city" placeholder="Enter city">
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Country:</label>
        <select name="country" id="country-select" class="form-control">
          <option value="">Select country</option>
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
          <option value="Canada">Canada</option>
        </select>
      </div>
     
        <div class="col-sm-6">
          <label style="font-weight:lighter;">State:</label>
          <select name="state" id="state-select" class="form-control">
            <option value="">Select state</option>
          </select>
        </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Phone number:</label>
        <input type="text" name="phone" placeholder="Enter number">
      </div>
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Company Name:</label>
        <input type="text" name="companyname" placeholder="Enter company name">
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Tax number:</label>
        <input type="text" name="tax" placeholder="Enter tax number">
      </div>
      <div class="col-sm-6">
        <label style="font-weight:lighter;">Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
      </div>
    </div>

   <div class="row">
  <div class="col-sm-6">
    <label style="font-weight:lighter;">Profile Image:</label>
    <input type="file" name="image" class="form-control" style="padding: 8px;">
  </div>
  <div class="col-sm-6">
    <label style="font-weight:lighter;">Tag:</label>
    <input name="tags" id="tagsInput" class="form-control tagify-style"
       placeholder="Add tags..." value="{{ current_tags|default_if_none:'' }}">


  </div>
</div>


    <label style="font-weight:lighter;">Status:</label>
    <select name="status">
      <option value="new">New</option>
      <option value="followup">Follow Up</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
      <option value="later">Later</option>
    </select>
<center>
    <button type="submit" class="btn btn-green">{% if lead %}Update{% else %}Create{% endif %}</button>
    <a href="{% url 'client_dashboard' %}" class="btn btn-red" >Close</a></center>
  </form>
</div>

<script>
  const countryToStates = {
    India: ['Kerala', 'Tamil Nadu', 'Karnataka', 'Andhra Pradesh','Arunachal pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal pradesh','Jharkhand','Madhya pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'],
    USA: ['Maine', 'New Hampshire', 'Vermpont', 'Massa Chusetts','Rhode Island','Connecticut','New York','New Jersey','Pennsylvania','Delaware','Maryland','Washington D.C','Virginia','West Verginia','Kentucky','Tennessee','North Carolina','South Carolina','Georgia','Florida','Illinois','Indiana','Michigan','Ohio','Wisconsin','Minnesota','Iowa','Kansas',' Missouri','Nebraska','North Dakota',' South Dakota',' Arizona','New Mexico','Texas','Oklahoma','Montana','Wyoming','Idaho','Utah','Nevada','Colorado','Oregon','Washington','California','Alaska','Hawaii'],
    UK: ['England', 'Scotland', 'Wales', 'Northern Ireland'],
    Canada: ['Ontario', 'Quebec', 'British Columbia', 'Alberta']
  };

  document.getElementById('country-select').addEventListener('change', function() {
    const country = this.value;
    const states = countryToStates[country] || [];

    const stateSelect = document.getElementById('state-select');
    stateSelect.innerHTML = '<option value="">Select state</option>';

    states.forEach(function(state) {
      const option = document.createElement('option');
      option.value = state;
      option.textContent = state;
      stateSelect.appendChild(option);
    });
  });
</script>
<script>
  var input = document.querySelector('#tagsInput');

  // Tagify setup with dynamic Django tags
  var tagify = new Tagify(input, {
    whitelist: [
      {% for tag in tags %}
        "{{ tag.name }}",
      {% endfor %}
    ],
    dropdown: {
      enabled: 1, // Show suggestions on input focus
      maxItems: 10,
      classname: "tags-look",
      closeOnSelect: false
    }
  });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
