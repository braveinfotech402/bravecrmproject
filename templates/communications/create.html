{% extends "base.html" %}
{% block content %}

<div class="container mt-4" style="max-width: 700px;">
  <h3 class="mb-4">📞 Schedule Call with {{ lead.firstname }} {{ lead.lastname }}</h3>

  <form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
      <label class="form-label">Call Time</label>
      <input type="datetime-local" name="call_time" class="form-control form-control-lg" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Duration (minutes)</label>
      <input type="number" name="duration" class="form-control form-control-lg">
    </div>

    <div class="mb-3">
      <label class="form-label">Status</label>
      <select name="status" class="form-control form-control-lg">
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
        <option value="missed">Missed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Notes</label>
      <textarea name="notes" rows="4" class="form-control form-control-lg"></textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100">💾 Save Call</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
