<!DOCTYPE html>
<html lang="en">
<head>
  <title></title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    .navbar{
      background-color: darkblue;
      color: white;
    }
   
    .bg{
      background-color: rgb(202, 219, 225);
    }
    

    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      display: inline-block;
      border: 3px solid #ccc;
      box-sizing: border-box;
    }
    
    button {
      background-color:darkblue;
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    
    button:hover {
      opacity: 0.8;
    }
    
    
    
    .imgcontainer {
      text-align: center;
      margin: 24px 0 12px 0;
    }
    
    img.avatar {
      width: 40%;
      border-radius: 50%;
    }
    
    .container {
      padding: 15px;
      width: 30%;
      background-color: white;
    }
    
    span.psw {
      float: right;
      padding-top: 16px;
    }
    
    /* Change styles for span and cancel button on extra small screens */
    @media screen and (max-width: 300px) {
      span.psw {
         display: block;
         float: none;
      }
      .cancelbtn {
         width: 100%;
      }
    }
  </style>
</head>
<body class="bg">
 
    <nav class="navbar navbar ">
        <div class="container-fluid">

            <div class="row">
             <div class="col-sm-4"><div class="navbar-header" >
               
              </div></div>
              
            </nav></div>
            {% if messages %}
             <script>
                {% for message in messages %}
                alert("{{ message }}");
                {% endfor %}
             </script>
            {% endif %}
           
            <center><h2>Assign permission</h2></center>
            {% if message %}
            <div class="message {% if 'success' in message %}success{% else %}error{% endif %}">
                {{ message }}
            </div>
        {% endif %}

<form action="" method="post">
    {% csrf_token %}
  <div class="imgcontainer">
    
  </div>

  <div class="container">
    <label for="group_name">Group Name:</label>
    
    <input type="text" id="group_name" name="group_name" required>

    <label for="permission_codename">Permission Codename:</label>
    <input type="text" id="permission_codename" name="permission_codename" required>

    <button type="submit">Assign Permission</button>
    
  </div>

  <div class="container" style="background-color:#f1f1f1">
    
    
    
  </div>
</form> 
        
</body>
</html>
