<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editable Lead Details with CKEditor 5</title>
  <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
  <style>
    #info-box, #editor-box {
      border: 1px solid #ccc;
      padding: 15px;
      width: 600px;
      min-height: 200px;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }

    button {
      margin-top: 10px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

<!-- Static View Mode -->
<div id="info-box">
  <div id="lead-content">
    <p><strong>Name:</strong> John Doe</p>
    <p><strong>Email:</strong> john@example.com</p>
  </div>
  <button id="edit-button">Edit</button>
</div>

<!-- Edit Mode -->
<div id="editor-box" style="display: none;">
  <textarea id="lead-editor">
    <p><strong>Name:</strong> John Doe</p>
    <p><strong>Email:</strong> john@example.com</p>
    <p><strong>Phone:</strong> 9876543210</p>
    <p><strong>Address:</strong> 123 Main Street, Springfield</p>
  </textarea>
  <button id="save-button">Save</button>
  <button id="cancel-button">Cancel</button>
</div>

<script>
  let editorInstance;

  const infoBox = document.getElementById("info-box");
  const editorBox = document.getElementById("editor-box");

  const editBtn = document.getElementById("edit-button");
  const saveBtn = document.getElementById("save-button");
  const cancelBtn = document.getElementById("cancel-button");

  editBtn.addEventListener("click", function () {
    infoBox.style.display = "none";
    editorBox.style.display = "block";

    ClassicEditor
      .create(document.querySelector("#lead-editor"))
      .then(editor => {
        editorInstance = editor;
      })
      .catch(error => {
        console.error("CKEditor error:", error);
      });
  });

  cancelBtn.addEventListener("click", function () {
    if (editorInstance) {
      editorInstance.destroy().then(() => {
        editorInstance = null;
        editorBox.style.display = "none";
        infoBox.style.display = "block";
      });
    }
  });

  saveBtn.addEventListener("click", function () {
    const updatedHTML = editorInstance.getData();

    document.getElementById("lead-content").innerHTML = updatedHTML;

    editorInstance.destroy().then(() => {
      editorInstance = null;
      editorBox.style.display = "none";
      infoBox.style.display = "block";
    });
  });
</script>

</body>
</html>
