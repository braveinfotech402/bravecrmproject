{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <h2>Delete Lead</h2>
  <p>Are you sure you want to delete <strong>"{{ lead.name }}"</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <div class="btn-group mt-3">
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'lead_confirm_delete' %}" class="btn btn-primary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
