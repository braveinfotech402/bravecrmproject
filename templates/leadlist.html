<table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Email</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for lead in leads %}
      <tr>
        <td>{{ lead.date }}</td>
        <td>{{ lead.email }}</td>
        <td>{{ lead.get_status_display }}</td>
        <td>
          <a href="{% url 'lead_detail' lead.id %}" class="btn btn-info btn-sm">View</a>
          <a href="{% url 'lead_update' lead.id %}" class="btn btn-warning btn-sm">Edit</a>
          <form action="{% url 'lead_delete' lead.id %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="text-center">No leads available.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
